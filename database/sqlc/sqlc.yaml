version: "2"
sql:
  - schema: "database/migrations/"
    queries: "database/queries/"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "backend/services/api/internal/platform/postgres/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false